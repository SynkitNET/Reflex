<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reflex · interface preview</title><link rel="stylesheet" href="style.css">
<style>body{background:#0d0f10;display:flex;align-items:center;justify-content:center;padding:32px;min-height:100vh;height:auto;overflow:auto}.preview-layout{display:flex;align-items:flex-start;gap:48px}.preview-intro{width:250px;padding-top:24px}h1{font-size:48px;letter-spacing:-2px;margin:12px 0;font-weight:500}.preview-intro p{color:#959b9c;line-height:1.7}.preview-intro .button{display:block;margin-top:12px;cursor:pointer}.preview-intro label{display:block;margin-top:25px;color:#959b9c;font-size:11px}.preview-intro select{display:block;margin:8px 0 18px;padding:8px;background:#202226;border:1px solid #3a3d43}.app{width:440px;height:620px;min-width:320px;min-height:360px;max-width:2400px;max-height:1800px;resize:both;border:1px solid #3b3d3d;border-radius:4px;overflow:hidden}dialog{margin:auto;max-width:94vw;max-height:94vh}dialog::backdrop{background:rgba(0,0,0,.65)}#wheel-dialog{width:380px;height:425px}@media(max-width:800px){body{padding:15px}.preview-layout{display:block}.preview-intro{width:auto;padding-top:0;margin-bottom:25px}.app{width:min(440px,94vw)}} </style></head>
<body><div class="preview-layout"><aside class="preview-intro"><p>Synkit</p><h1>Reflex</h1><p>Find it. Run it.<br>Get back to your canvas.</p><button id="open-palette" class="button primary">Open search palette</button><button id="open-wheel" class="button">Open quick wheel</button><label for="preview-size">Panel size</label><select id="preview-size"><option value="440,620">440 × 620 · Floating</option><option value="360,440">360 × 440 · Compact</option><option value="320,360">320 × 360 · Minimum</option><option value="760,850">760 × 850 · Expanded</option></select><p>Interface preview with sample data.<br>Photoshop commands are simulated here.</p></aside><main id="panel" class="app"></main></div>
<dialog id="palette-dialog"><div id="palette-root"></div></dialog><dialog id="wheel-dialog"><div id="wheel-root"></div></dialog>
<script src="shortcuts.js"></script><script src="core.js"></script><script src="catalog.js"></script><script src="assets/theme-assets.js"></script><script src="theme.js"></script><script src="ui.js"></script><script src="preview.js"></script></body></html>
