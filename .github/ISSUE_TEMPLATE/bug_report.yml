name: Bug report
description: Report a problem with Reflex.
title: "Bug: "
body:
  - type: input
    id: version
    attributes:
      label: Reflex version
      placeholder: 0.6.7
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Photoshop version and operating system
      placeholder: Photoshop 26.x, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or wheel slot and the document or layer type involved.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error text or screenshots
      description: Include the text from Shortcuts → Shortcut status when relevant.
